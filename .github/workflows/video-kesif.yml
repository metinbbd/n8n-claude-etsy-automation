name: Video - klip kesfi

on:
  workflow_dispatch:
    inputs:
      proje:
        description: "video/projeler altindaki proje klasoru"
        required: true

permissions:
  contents: write

concurrency:
  group: video   # videolar tek tek: ayni anda tek video isi
  cancel-in-progress: false

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg
        run: |
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
          echo /tmp/ffmpeg-master-latest-linux64-gpl/bin >> "$GITHUB_PATH"
      - name: Kesif
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/kesif
          python3 video/kesif.py "video/projeler/${{ inputs.proje }}/kesif.json" /tmp/kesif 2>&1 | tee /tmp/kesif/kayit.txt
      - name: Onizleme dalina kaydet
        if: always()
        run: |
          video/onizleme_kaydet.sh /tmp/kesif "kesif/${{ inputs.proje }}" "Kesif - ${{ inputs.proje }}"
