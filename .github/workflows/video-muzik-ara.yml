name: Video - muzik arama
# Kevin MacLeod (CC BY) listesinden hareketli, belgesel altina uygun parcalari olcer. Video uretmez.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video   # videolar tek tek: ayni anda tek video isi
  cancel-in-progress: false

jobs:
  muzik:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg ve numpy
        run: |
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
          echo /tmp/ffmpeg-master-latest-linux64-gpl/bin >> "$GITHUB_PATH"
          pip install -q numpy
      - name: Muzik tara
        run: |
          mkdir -p /tmp/cikti
          python3 video/muzik_ara.py /tmp/cikti 2>&1 | tee /tmp/cikti/kayit.txt
      - name: Onizleme dalina kaydet
        if: always()
        run: video/onizleme_kaydet.sh /tmp/cikti "muzik/arama" "Muzik arama"
