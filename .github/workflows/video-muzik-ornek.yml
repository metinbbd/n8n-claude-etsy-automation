name: Video - muzik ornekleri
# Secilen parcalardan 30 saniyelik dinleme ornekleri keser (video uretmez).
on:
  workflow_dispatch:
    inputs:
      parcalar:
        description: "Parca basliklari (incompetech dosya adi, .mp3 olmadan), noktali virgulle ayrilmis"
        required: true

permissions:
  contents: write

concurrency:
  group: video   # videolar tek tek: ayni anda tek video isi
  cancel-in-progress: false

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg
        run: |
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
          echo /tmp/ffmpeg-master-latest-linux64-gpl/bin >> "$GITHUB_PATH"
      - name: Ornekleri kes
        env:
          PARCALAR: ${{ inputs.parcalar }}
        run: |
          mkdir -p /tmp/cikti
          python3 - <<'PY'
          import os, re, subprocess, urllib.parse, urllib.request
          for i, t in enumerate([x.strip() for x in os.environ["PARCALAR"].split(";") if x.strip()], 1):
              url = "https://incompetech.com/music/royalty-free/mp3-royaltyfree/" + urllib.parse.quote(t) + ".mp3"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  open("/tmp/tam.mp3", "wb").write(urllib.request.urlopen(req, timeout=120).read())
              except Exception as e:
                  print("INDIRILEMEDI", t, e)
                  continue
              ad = re.sub(r"[^A-Za-z0-9]+", "_", t).strip("_")
              subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-ss", "40", "-t", "30", "-i", "/tmp/tam.mp3",
                              "-af", "afade=t=in:d=1,afade=t=out:st=28:d=2", "-b:a", "128k", f"/tmp/cikti/{i:02d}_{ad}.mp3"], check=True)
              print("TAMAM", i, t)
          PY
          ls -la /tmp/cikti
      - name: Onizleme dalina kaydet
        if: always()
        run: video/onizleme_kaydet.sh /tmp/cikti "muzik/ornek" "Muzik ornekleri"
