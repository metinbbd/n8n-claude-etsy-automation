name: Video - paylas (GitHub disinda indirme linki)
# 1080p altyazili videolari GitHub hesabi gerektirmeyen bir paylasim sitesine (gofile.io) yukler
# ve indirme sayfasi linklerini loga yazar. Dosyalar tek parca kalir.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Videolari indir ve yukle
        run: |
          set -uo pipefail
          mkdir -p /tmp/indir
          for TAG in 01-gunes-firtinasi 02-asteroitler 03-kara-delikler 04-samanyolu-andromeda; do
            rm -f /tmp/indir/*
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" --dir /tmp/indir --pattern '*-altyazili.mp4'
            F=$(ls /tmp/indir/*-altyazili.mp4 | head -1)
            echo "=== $TAG  $(basename "$F")  $(stat -c%s "$F") bayt"
            LINK=""
            for DENEME in 1 2 3; do
              YANIT=$(curl -s --max-time 3000 -F "file=@$F" https://upload.gofile.io/uploadfile || true)
              LINK=$(echo "$YANIT" | python3 -c "import sys,json
try:
    d=json.load(sys.stdin); print(d['data']['downloadPage'])
except Exception: print('')")
              [ -n "$LINK" ] && break
              echo "gofile deneme $DENEME basarisiz: ${YANIT:0:200}"
              sleep 10
            done
            if [ -z "$LINK" ]; then
              LINK=$(curl -s --max-time 3000 -T "$F" https://temp.sh/upload || true)
            fi
            echo "LINK $TAG $LINK"
          done
