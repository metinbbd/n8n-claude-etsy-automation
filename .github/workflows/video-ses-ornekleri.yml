name: Video - anlatici ses ornekleri

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: kokoro-v1
      - name: Kurulum (ffmpeg + Kokoro TTS, CPU)
        run: |
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
          echo /tmp/ffmpeg-master-latest-linux64-gpl/bin >> "$GITHUB_PATH"
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Ornekleri uret
        run: OUT=/tmp/ses python3 video/ses_ornekleri.py
      - name: Onizleme dalina kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin medya-onizleme && git checkout -q medya-onizleme || git checkout -q --orphan medya-onizleme
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p ses-ornekleri && cp /tmp/ses/*.mp3 ses-ornekleri/
          git add ses-ornekleri && git commit -qm "Anlatici ses ornekleri" && git push -q origin medya-onizleme
